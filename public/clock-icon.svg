<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Left flip card - full card -->
  <rect x="1" y="5" width="13" height="22" rx="3" fill="#1c1c1c"/>
  <!-- Top panel (lighter) -->
  <rect x="1" y="5" width="13" height="10" rx="3" fill="#383838"/>
  <rect x="1" y="11" width="13" height="4" fill="#383838"/>
  <!-- Split gap shadow -->
  <rect x="1" y="14.5" width="13" height="2" fill="#080808"/>
  <!-- Digit bars - top half (bright) -->
  <rect x="4" y="8" width="7" height="1.5" rx="0.75" fill="rgba(255,255,255,0.85)"/>
  <rect x="4" y="11.5" width="7" height="1.5" rx="0.75" fill="rgba(255,255,255,0.85)"/>
  <!-- Digit bars - bottom half (dim) -->
  <rect x="4" y="18" width="7" height="1.5" rx="0.75" fill="rgba(255,255,255,0.22)"/>
  <rect x="4" y="22" width="7" height="1.5" rx="0.75" fill="rgba(255,255,255,0.22)"/>

  <!-- Right flip card - full card -->
  <rect x="18" y="5" width="13" height="22" rx="3" fill="#1c1c1c"/>
  <!-- Top panel (lighter) -->
  <rect x="18" y="5" width="13" height="10" rx="3" fill="#383838"/>
  <rect x="18" y="11" width="13" height="4" fill="#383838"/>
  <!-- Split gap shadow -->
  <rect x="18" y="14.5" width="13" height="2" fill="#080808"/>
  <!-- Digit bars - top half (bright) -->
  <rect x="21" y="8" width="7" height="1.5" rx="0.75" fill="rgba(255,255,255,0.85)"/>
  <rect x="21" y="11.5" width="7" height="1.5" rx="0.75" fill="rgba(255,255,255,0.85)"/>
  <!-- Digit bars - bottom half (dim) -->
  <rect x="21" y="18" width="7" height="1.5" rx="0.75" fill="rgba(255,255,255,0.22)"/>
  <rect x="21" y="22" width="7" height="1.5" rx="0.75" fill="rgba(255,255,255,0.22)"/>

  <!-- Colon dots -->
  <circle cx="16" cy="11.5" r="1.5" fill="#666"/>
  <circle cx="16" cy="20.5" r="1.5" fill="#666"/>
</svg>
